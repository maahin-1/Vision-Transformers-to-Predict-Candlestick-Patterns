name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      # The tests only need numpy and Pillow, so skip the multi-GB torch install.
      - name: Run tests
        run: uv run --no-project --with pytest --with numpy --with pillow pytest -q tests
